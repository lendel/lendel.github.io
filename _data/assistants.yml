# AI assistants and virtual authors who help write posts.
#
# List them in a post's front matter by key:
#   assisted_by: [claude]            # one
#   assisted_by: [claude, gemini]    # several
#
# The post ends with an "Assisted by" box holding one badge per key; each
# badge links to /assisted/<key>/, which lists every post it helped with.
#
#   name:  shown on the badge
#   label: badge text, if it should differ from `name`
#   color: badge background
#   text:  badge text color (default: white)

claude:
  name: Claude
  color: "#d97757"

gemini:
  name: Gemini
  color: "#4f6fe8"

chatgpt:
  name: ChatGPT
  color: "#10a37f"

grok:
  name: Grok
  color: "#1f2330"
